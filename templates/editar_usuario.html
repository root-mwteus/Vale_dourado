<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body">
<nav class="app-navbar">
    <div class="container-fluid px-4 py-3 d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">Vale Dourado</a>
        <form action="{{ url_for('logout') }}" method="POST" class="m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-outline-light btn-sm fw-bold px-3">Sair</button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <section class="hero-card mb-4">
        <div>
            <p class="eyebrow">Gestão de equipe</p>
            <h2>Editar usuário</h2>
            <p class="mb-0">Atualize o perfil ou a senha do colaborador.</p>
        </div>
        <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-secondary">Voltar</a>
    </section>

    <section class="panel-card">
        {% if mensagem_erro %}
        <div class="alert alert-danger">{{ mensagem_erro }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="username">Usuário</label>
                    <input type="text" class="form-control" id="username" value="{{ usuario.username }}" disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="role">Perfil</label>
                    <select class="form-select" id="role" name="role">
                        <option value="funcionario" {% if usuario.role == 'funcionario' %}selected{% endif %}>Funcionário</option>
                        <option value="admin" {% if usuario.role == 'admin' %}selected{% endif %}>Administrador</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="password">Nova senha</label>
                    <input type="password" class="form-control" id="password" name="password">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="confirm_password">Confirmar nova senha</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
