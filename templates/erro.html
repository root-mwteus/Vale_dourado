<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Valedourado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    <div class="login-page">
        <div class="brand-badge">
            <img src="{{ url_for('static', filename='images.png') }}" alt="Logo Valedourado" class="logo-empresa">
            <div class="brand-meta">
                <span class="brand-title">Vale Dourado</span>
                <span class="brand-subtitle">Gestão operacional • Segurança • Controle</span>
            </div>
        </div>

        <div class="main-container" style="max-width: 480px;">
            <div class="login-box">
                <div class="login-inner text-center shadow-sm">
                    <div class="login-inner-header">
                        {{ titulo }}
                    </div>
                    <div class="px-4 pt-2 pb-4">
                        <p class="text-secondary mb-4">{{ mensagem }}</p>
                        <a href="{{ url_for('home') }}" class="btn btn-primary px-4 py-2 fw-bold">Voltar ao início</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
