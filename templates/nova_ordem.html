<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ordem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand mb-0 h1 fw-bold" href="{{ url_for('dashboard') }}">ORDENS DE SERVIÇO</a>
        <form action="{{ url_for('logout') }}" method="POST" class="m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-outline-light btn-sm fw-bold px-3">Sair</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0 p-4">
        <h2 class="h4 text-primary mb-3">{{ 'Editar Ordem' if ordem else 'Nova Ordem de Serviço' }}</h2>
        {% if mensagem_erro %}
        <div class="alert alert-danger">{{ mensagem_erro }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="titulo">Título</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" value="{{ ordem.titulo if ordem else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="cliente">Cliente</label>
                    <input type="text" class="form-control" id="cliente" name="cliente" value="{{ ordem.cliente if ordem else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="prioridade">Prioridade</label>
                    <select class="form-select" id="prioridade" name="prioridade">
                        <option value="Alta" {% if ordem and ordem.prioridade == 'Alta' %}selected{% endif %}>Alta</option>
                        <option value="Média" {% if ordem and ordem.prioridade == 'Média' %}selected{% endif %}>Média</option>
                        <option value="Baixa" {% if ordem and ordem.prioridade == 'Baixa' %}selected{% endif %}>Baixa</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="setor">Setor</label>
                    <input type="text" class="form-control" id="setor" name="setor" value="{{ ordem.setor if ordem else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="responsavel">Responsável</label>
                    <input type="text" class="form-control" id="responsavel" name="responsavel" value="{{ ordem.responsavel if ordem else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="status">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="Aberta" {% if ordem and ordem.status == 'Aberta' %}selected{% endif %}>Aberta</option>
                        <option value="Em andamento" {% if ordem and ordem.status == 'Em andamento' %}selected{% endif %}>Em andamento</option>
                        <option value="Concluída" {% if ordem and ordem.status == 'Concluída' %}selected{% endif %}>Concluída</option>
                        <option value="Cancelada" {% if ordem and ordem.status == 'Cancelada' %}selected{% endif %}>Cancelada</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label" for="descricao">Descrição</label>
                    <textarea class="form-control" id="descricao" name="descricao" rows="4" required>{{ ordem.descricao if ordem else '' }}</textarea>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Salvar</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('ordens') }}">Voltar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
